[project]
name = "india-econ-dashboard"
version = "0.0.1"
description = "Data pipelines for the India economy dashboard (name in site.config.yaml)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "yfinance>=0.2.40",
    "cryptography>=43",
    "python-calamine>=0.3",
    "anthropic>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
