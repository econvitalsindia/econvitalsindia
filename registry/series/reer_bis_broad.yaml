notes: 'Real effective exchange rate against 64 economies, monthly average, index
  2020 = 100; a rise is a stronger rupee. BIS, not RBI: RBI''s own 40-currency indices
  are in the RBI Bulletin, whose tables have no stable links. Levels
  differ from RBI''s because the base and weights differ; the direction of moves is
  comparable.'
