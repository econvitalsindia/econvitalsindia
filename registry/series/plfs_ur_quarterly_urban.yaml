notes: Quarterly bulletin, current weekly status, urban areas, since 2018.
exclude:
- period: '2019-04-01'
  added: '2026-10-28'
  reason: MoSPI's API gives 21.6% for urban unemployment in April-June 2019, between
    9.2% (Jan-Mar 2019) and 8.1% (Jul-Sep 2019) with no shock in that quarter; it
    is close to the April-June 2020 lockdown figure (20.8%), so it looks mis-dated
    in the API. Left out until checked against the PLFS quarterly bulletin.
