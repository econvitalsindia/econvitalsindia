notes: 'Lakh members: new subscribers minus exits plus those who rejoined, all ages.
  Provisional and revised for months afterwards; each month shows the newest report
  that prints it. It counts people joining the EPF scheme (formal jobs above the wage
  ceiling, and formalisation of existing jobs), not total employment. EPFO''s Data
  Hub has posted no report after September 2025 (checked 29 Oct 2026). EPFO refuses
  requests from GitHub''s US servers, so the fetch is manual.'
