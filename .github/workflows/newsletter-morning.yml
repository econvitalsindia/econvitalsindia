name: newsletter-morning
# Every day at 07:30 IST (newsletter.writer: "api"): write the morning email with Claude
# through the Anthropic API, check it, fall back to the fixed template, and send it through
# Buttondown. Skips quietly unless writer is "api", newsletter.enabled is true and the
# BUTTONDOWN_API_KEY secret exists. A manual draft pushed the same day (newsletter-send.yml)
# and this run never both send: data/newsletter/sent.json allows one email a day.
# Runbook: "Newsletter".
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: newsletter
jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Write, check and send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: uv run python -m pipelines.newsletter.morning auto --date "$(TZ=Asia/Kolkata date +%F)"
      - name: Archive the email (and record it as sent)
        run: |
          if [ -n "$(git status --porcelain data/newsletter)" ]; then
            git config user.name "newsletter-bot"; git config user.email "newsletter-bot@users.noreply.github.com"
            git add data/newsletter
            git commit -m "newsletter: morning email $(TZ=Asia/Kolkata date +%F)"
            for i in 1 2 3; do git push && break || git pull --rebase -X theirs origin main; done
          fi
