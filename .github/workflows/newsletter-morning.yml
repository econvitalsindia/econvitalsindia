name: newsletter-morning
# API mode only (newsletter.writer: "api", paid): write the morning email with Claude through
# the Anthropic API, check it, fall back to the fixed template, and send it. The default is
# manual mode (newsletter-send.yml sends the maintainer's draft), so this runs only by hand.
# To automate it, set writer: "api", add the ANTHROPIC_API_KEY secret and uncomment the
# schedule (07:30 IST). Runbook: "Newsletter".
on:
  # schedule:
  #   - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: newsletter
jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Write, check and send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: uv run python -m pipelines.newsletter.morning auto --date "$(TZ=Asia/Kolkata date +%F)"
      - name: Archive the email (and record it as sent)
        run: |
          if [ -n "$(git status --porcelain data/newsletter)" ]; then
            git config user.name "newsletter-bot"; git config user.email "newsletter-bot@users.noreply.github.com"
            git add data/newsletter
            git commit -m "newsletter: morning email $(TZ=Asia/Kolkata date +%F)"
            for i in 1 2 3; do git push && break || git pull --rebase -X theirs origin main; done
          fi
