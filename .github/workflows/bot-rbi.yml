name: rbi-bot
# RBI data (weekly supplement, BoP, surveys, MPC minutes) and FBIL, Mon-Sat 18:30 IST. Sources: registry/bots.yaml. Times are IST; cron is UTC.
on:
  schedule:
    - cron: "0 13 * * 1-6"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: data-bots
  cancel-in-progress: false
jobs:
  run:
    uses: ./.github/workflows/bot.yml
    with:
      bot: rbi
