name: deploy
# Builds the site and uploads it to Cloudflare Pages (direct upload).
# Runs on pushes to main, and when a data bot or the briefing workflow calls it after
# committing (their pushes use GITHUB_TOKEN, which does not trigger push events). Skips quietly until the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets exist.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
  issues: read
  actions: read   # the status page estimates this month's Actions minutes from run times
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'econvitalsindia' }}
    steps:
      - name: Check Cloudflare secrets
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          ref: main   # always deploy the latest main, including a bot's fresh commit
      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}   # lets the status page list open issues
        run: |
          uv sync
          (cd site && npm ci)
          make build
      - name: Upload to Cloudflare Pages
        if: steps.gate.outputs.ok == 'true'
        run: npx --yes wrangler@4 pages deploy site/dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
