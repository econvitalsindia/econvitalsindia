name: update-data
# Refresh EVERY `fetch: auto` source in one run, by hand only. The scheduled refreshes are
# the data bots (bot-*.yml, registry/bots.yaml); use this after a long outage or a big fix.
on:
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: data-bots
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Fetch, validate, publish
        id: run
        run: uv run python -m pipelines.run --fetch auto
        continue-on-error: true
      - name: Report failures as issues (and close recovered ones)
        if: always() && steps.run.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python scripts/report_failures.py
      - name: Keep raw downloads (90 days)
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: data/raw/
          retention-days: 90
      - name: Commit as data-bot
        id: commit
        run: uv run python scripts/bot_commit.py data
      - name: Deploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
