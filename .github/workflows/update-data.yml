name: update-data
# Daily data refresh for every `fetch: auto` series (docs/guidebook/01-architecture.md).
# 13:00 UTC = 18:30 IST, Monday-Saturday. Also runnable by hand.
on:
  schedule:
    - cron: "0 13 * * 1-6"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: update-data
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Fetch, validate, publish
        id: run
        run: uv run python -m pipelines.run --fetch auto
        continue-on-error: true
      - name: Report failures as issues
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python scripts/report_failures.py
      - name: Keep raw downloads (90 days)
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: data/raw/
          retention-days: 90
      - name: Commit new data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/series data/meta data/revisions data/status.json
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: daily update $(date -u +%F)"
          git push
