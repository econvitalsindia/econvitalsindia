name: check-secrets
# Diagnostic: reports whether each secret the workflows need is visible to Actions in this
# repo (repository or organization secrets). Prints "present" or "MISSING", never values.
on:
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Which secrets can workflows see?
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in ANTHROPIC_API_KEY BUTTONDOWN_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -n "${!name}" ]; then echo "$name: present (${#name} chars in name)"; else echo "$name: MISSING"; fi
          done
