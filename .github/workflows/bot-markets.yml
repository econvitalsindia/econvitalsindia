name: markets-bot
# Markets and policy rates, Mon-Fri 10:00, 12:00, 14:00, 16:00 and 18:00 IST. Sources: registry/bots.yaml. Times are IST; cron is UTC.
on:
  schedule:
    - cron: "30 4,6,8,10,12 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: data-bots
  cancel-in-progress: false
jobs:
  run:
    uses: ./.github/workflows/bot.yml
    with:
      bot: markets
