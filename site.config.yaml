# ---------------------------------------------------------------------------
# SINGLE SOURCE OF TRUTH for the site's identity.
# The site name must appear ONLY in this file. Code, templates and docs read
# it from here (or say "the site"). `make check` fails if the name is
# hard-coded anywhere else. To rename: see docs/guidebook/09-rebranding.md.
# ---------------------------------------------------------------------------
site:
  name: "Econvitals India"
  short_name: "EVI"
  tagline: "A running read on the health of the Indian economy"
  description: >-
    The latest data on India's growth, prices, jobs, money, markets, public
    finances and external sector, in one place, updated as the numbers come out.
  url: "https://econvitalsindia.pages.dev"   # change at launch if a custom domain is used
  language: "en-IN"
  timezone: "Asia/Kolkata"

credit:
  inspired_by_name: "Econvitals"
  inspired_by_url: "https://econvitals.org"
  inspired_by_text: >-
    Inspired by Econvitals, Jason Furman's dashboard of the U.S. economy.
    This is an independent project, not affiliated with Econvitals.

brand:
  colors:
    primary: "#1F2A6B"    # deep indigo
    accent: "#E8892B"     # saffron accent (not flag saffron, deliberately)
    ink: "#1A1A1A"
    paper: "#FFFFFF"     # white, light theme only (the maintainer asked for a light site, 2026-10-28)
  logo_mark: "assets/brand/mark.svg"   # name-independent mark
  fonts:
    serif: "Literata"
    sans: "Inter"

conventions:
  fiscal_year_start_month: 4          # April
  fy_label: "FY{yy_end}"              # 2025-26 -> FY26
  quarter_label: "Q{q} FY{yy_end}"    # Apr-Jun 2026 -> Q1 FY27
  money_unit_domestic: "lakh_crore"   # ₹ lakh crore for fiscal/money aggregates
  money_unit_external: "usd_bn"       # US$ bn for external sector

contact:
  feedback_email: "bishmaykbarik@gmail.com"
  social: {}

team:
  # Shown on the About page. Add RAs and contributors here as they join.
  maintainer: "Bishmay Barik"
  note: "This version of the site is built and maintained single-handedly by Bishmay Barik. The team section will be updated as others join."

newsletter:
  # The MORNING email: written each day with AI from a fact pack, checked so every number
  # comes from the stored series, and sent when the maintainer pushes the draft.
  # pipelines/newsletter/morning.py; runbook 06-operations-runbook.md ("Newsletter").
  provider: "buttondown"
  enabled: false          # true once the Buttondown account exists and the secrets are set
  buttondown_username: "" # your Buttondown username; the signup box appears once this is set
  writer: "manual"        # "manual": you write with any AI from the fact pack (no API cost)
                          # "api": the 07:30 workflow calls the Anthropic API itself (paid)
  llm_model: "claude-opus-5-5"   # api mode only; "claude-haiku-5-5" costs about 1/40th as much
  # The old weekly digest (digest.py) is kept but no longer scheduled: Buttondown's free plan
  # allows one email a day, and the morning email uses it.
  products: [weekly-briefing, release-note]

briefings:
  require_human_approval: true        # AI drafts -> PR -> human merge publishes
  llm_model: ""                       # chosen after the Phase 3 benchmark
